name: terra_gpu_cache
gpu_type: GPU
remote_host: Terra
default: false
slurm:
  account: pn52pi-c
  job_name_prefix: TERRA-GPU-CACHE
  gres: gpu
  partition: hpda2_compute_gpu
  constraint: null
  qos: null
  dev_qos: null
  max_time_hours: 240
  default_time: "24:00:00"
  dev_time: "2:00:00"
  min_time: null
  use_min_time_default: false
  hint: null
  signal: null
  output: /dss/dsshome1/0B/di54kay/outputs/%j.log
  error: /dss/dsshome1/0B/di54kay/outputs/%j.log
  require_tag: false
  exclude: hpdar04c01s01
  mem: 256G
  mail-user: yohann.perron@dm3l.uzh.ch
resources:
  gpu_per_node: 1
  cpu_per_gpu: 24
  task_mode: per_gpu
  exclusive: false
  multi_gpu_overrides:
    trainer: ddp
modules:
  purge: false
  load:
    - uv
    - gcc
    - git/2.49.0
environment:
  shell_init: null
  activate_command: uv sync
  pre_run:
    - 'echo "Running on host: $(hostname)"'
    - 'export DISFOR_SOURCE="${DISFOR_SOURCE:-${PWD}/data/disfor}"'
    - 'export DISFOR_LOCAL_ROOT="${DISFOR_LOCAL_ROOT:-/tmp/${USER}/disfor}"'
    - 'export DISFOR_PREFETCH_JOBS="${DISFOR_PREFETCH_JOBS:-4}"'
    - 'export DISFOR_MIN_FREE_GB="${DISFOR_MIN_FREE_GB:-100}"'
    - 'export DISFOR_OVERLAY_WAIT_SECONDS="${DISFOR_OVERLAY_WAIT_SECONDS:-1800}"'
    - 'export DISFOR_PREFETCH_LOG="${DISFOR_PREFETCH_LOG:-${DISFOR_LOCAL_ROOT}.prefetch.log}"'
  exports: {}
  wandb:
    mode: offline
    set_name: true
    set_group: true
    name_key: logger.wandb.name
    group_key: logger.wandb.group
paths:
  remote_launcher_dir: scripts/sbatch/local_cache
  default_project_dir: /dss/dsshome1/0B/di54kay/code/disfor-code
  data_dir: /dss/dsshome1/0B/di54kay/data/disfor
  log_dir: /dss/dsshome1/0B/di54kay/code/disfor-code/logs
default_overrides:
  data: disfor
  test: "false"
  trainer: gpu
  data.num_workers: "16"
  model.compile: "false"
features:
  job_chaining: false
launcher:
  command_prefix: >-
    uv run python scripts/sbatch/local_cache/local_cache.py run
    --source "${DISFOR_SOURCE}"
    --destination "${DISFOR_LOCAL_ROOT}"
    --jobs "${DISFOR_PREFETCH_JOBS}"
    --min-free-gb "${DISFOR_MIN_FREE_GB}"
    --wait-seconds "${DISFOR_OVERLAY_WAIT_SECONDS}"
    --prefetch-log "${DISFOR_PREFETCH_LOG}"
    --append-data-root data.data_root
    -- uv run
project: disfor
