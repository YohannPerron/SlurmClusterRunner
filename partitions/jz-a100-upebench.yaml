# Task-specific JZ A100 partition for the UPE optimization benchmark.
#
# This file is intentionally named uniquely and sets `default: false`; it does
# NOT change any shared cluster default. Copy it into
# SlurmClusterRunner/partitions/ (that directory is what `load_partitions`
# reads; there is no `--config-dir` flag) before calling
# `uv run runner PARTITION=jz-a100-upebench ...`.
#
# Every path below is task-specific and disjoint from the shared AnySat project
# (`/lustre/fswork/projects/rech/msf/uih12tb/AnySat`) and from other users'
# directories. The launcher snapshot dir is unique so the runner's
# `rsync --delete` only ever touches this task's own directory.
name: jz-a100-upebench
gpu_type: A100
remote_host: JZ
default: false
slurm:
    account: msf@a100
    job_name_prefix: UPE
    gres: gpu
    partition: null
    constraint: a100
    qos: qos_gpu_a100-t3
    dev_qos: qos_gpu_a100-dev
    max_time_hours: 20
    default_time: "19:59:59"
    dev_time: 01:59:59
    min_time: "19:00:00"
    use_min_time_default: true
    hint: nomultithread
    signal: SIGUSR1@600
    output: /lustre/fsn1/projects/rech/msf/uih12tb/UPE_bench/logs/outputs/run%j.txt
    error: /lustre/fsn1/projects/rech/msf/uih12tb/UPE_bench/logs/outputs/run%j.txt
    require_tag: false
resources:
    gpu_per_node: 8
    cpu_per_gpu: 8
    task_mode: per_gpu
    exclusive: false
    multi_gpu_overrides:
        trainer: ddp
modules:
    purge: true
    load:
        - arch/a100
        - git
environment:
    shell_init: /linkhome/rech/genuvt01/uih12tb/.bashrc
    activate_command: micromamba activate SatNew
    exports:
        SRUN_CPUS_PER_TASK: $SLURM_CPUS_PER_TASK
        PYTHONPATH: .:./src
        # The default jz-a100.yaml sets TORCHDYNAMO_DISABLE=1, which disables
        # torch.compile entirely; the benchmark must re-enable it.
        TORCHDYNAMO_DISABLE: "0"
        # Keep the immutable code snapshot free of __pycache__.
        PYTHONDONTWRITEBYTECODE: "1"
        WANDB__SERVICE_WAIT: "300"
        WANDB_MODE: offline
    # Inductor code cache and TMPDIR are node-local ($JOBSCRATCH, created by the
    # JZ prolog) and therefore per-job. The shared `/lustre/fswork` project dir
    # is quota-limited and MUST NOT hold the compile cache: a 631 MB Inductor
    # cache there triggered EDQUOT (errno 122) during the first baseline run.
    pre_run:
        - 'export TORCHINDUCTOR_CACHE_DIR="${JOBSCRATCH:-${SLURM_TMPDIR:-/tmp}}/inductor_${SLURM_JOB_ID:-0}"'
        - 'export TMPDIR="${JOBSCRATCH:-${SLURM_TMPDIR:-/tmp}}/tmp_${SLURM_JOB_ID:-0}"'
        - 'export HF_HOME="${JOBSCRATCH:-${TMPDIR:-/tmp}}/hf_${SLURM_JOB_ID:-0}"'
        - 'mkdir -p "$TORCHINDUCTOR_CACHE_DIR" "$TMPDIR"'
    wandb:
        mode: offline
        set_name: false
        set_group: false
paths:
    remote_launcher_dir: UPE_bench/launcher/jz-a100-upebench
    # `sharedcoords-6b70c8c` is substituted at install time by the harness with the
    # commit-named (or task-named) snapshot dir, so each run gets its own
    # immutable code dir.
    default_project_dir: /lustre/fsn1/projects/rech/msf/uih12tb/UPE_bench/code/sharedcoords-6b70c8c
    data_dir: /lustre/fsn1/projects/rech/ufh/ult23zz/datasets/
    log_dir: /lustre/fsn1/projects/rech/msf/uih12tb/UPE_bench/logs
# Strip the AnySat Hydra defaults (`num_workers`, `hydra/job_logging`,
# `offline`, ...) -- the benchmark script is plain argparse and would only
# receive them as junk argv.
default_overrides: {}
features:
    job_chaining: false
launcher:
    command_prefix: srun
project: UPE_bench
