# Task-specific JZ A100 partition for ONE short Inductor-overflow diagnostic.
#
# Unique name + `default: false`: changes no shared cluster default. Derived from
# jz-a100-upeorch.yaml but pins cwd to the EXISTING immutable candidate snapshot
# (upe_orch/code/5e80c9f) and adds tracing exports so the compiler traceback is
# captured. The candidate snapshot is never rewritten; only a NEW diagnostic file
# is added under its tests/ dir.
name: jz-a100-upediag
gpu_type: A100
remote_host: JZ
default: false
slurm:
    dependency: afterany:1675194
    account: msf@a100
    job_name_prefix: UPEDIAG
    gres: gpu
    partition: null
    constraint: a100
    qos: qos_gpu_a100-t3
    dev_qos: qos_gpu_a100-dev
    max_time_hours: 20
    default_time: "19:59:59"
    dev_time: 01:59:59
    min_time: "19:00:00"
    use_min_time_default: true
    hint: nomultithread
    signal: SIGUSR1@600
    output: /lustre/fsn1/projects/rech/msf/uih12tb/upe_orch/logs/outputs/run%j.txt
    error: /lustre/fsn1/projects/rech/msf/uih12tb/upe_orch/logs/outputs/run%j.txt
    require_tag: false
resources:
    gpu_per_node: 8
    cpu_per_gpu: 8
    task_mode: per_gpu
    exclusive: false
    multi_gpu_overrides:
        trainer: ddp
modules:
    purge: true
    load:
        - arch/a100
        - git
environment:
    shell_init: /linkhome/rech/genuvt01/uih12tb/.bashrc
    activate_command: micromamba activate SatNew
    exports:
        SRUN_CPUS_PER_TASK: $SLURM_CPUS_PER_TASK
        PYTHONPATH: ./src
        TORCHDYNAMO_DISABLE: "0"
        # --- diagnostic tracing (added for the Inductor overflow root-cause) ---
        TORCHDYNAMO_VERBOSE: "1"
        TORCH_LOGS: graph_breaks,recompiles
        # Private diagnostic ONLY: bypass the optional int64 index-strength
        # reduction pass (monkeypatched in tests/diagnose_upe_orchestration.py).
        # NOT a production fix.
        UPE_DIAGNOSTIC_SKIP_INDEX_STRENGTH_REDUCTION: "1"
        TORCHINDUCTOR_CACHE_DIR: /lustre/fsn1/projects/rech/msf/uih12tb/upe_orch/inductor
        TMPDIR: /lustre/fsn1/projects/rech/msf/uih12tb/upe_orch/tmp
        PYTHONDONTWRITEBYTECODE: "1"
        WANDB__SERVICE_WAIT: "300"
        WANDB_MODE: offline
    wandb:
        mode: offline
        set_name: false
        set_group: false
paths:
    remote_launcher_dir: upe_orch/launcher/jz-a100-upediag
    default_project_dir: /lustre/fsn1/projects/rech/msf/uih12tb/upe_orch/code/5e80c9f
    data_dir: /lustre/fsn1/projects/rech/ufh/ult23zz/datasets/
    log_dir: /lustre/fsn1/projects/rech/msf/uih12tb/upe_orch/logs
default_overrides: {}
features:
    job_chaining: false
launcher:
    command_prefix: srun
project: AnySat
