# Task-specific JZ A100 partition for ONE short Inductor diagnostic that
# validates the temporal-index patch itself (no compiler bypass).
#
# Unique name + `default: false`: changes no shared cluster default.
# cwd is pinned to a NEW composed experiment dir
#   code/5e80c9f-c32c46f-temporal = immutable candidate 5e80c9f
#                                  + parent c32c46f temporal-coords hunk ONLY.
# The candidate snapshot is never rewritten (a fresh clone was patched).
# Unlike jz-a100-upediag there is deliberately NO
# UPE_DIAGNOSTIC_SKIP_INDEX_STRENGTH_REDUCTION export: the CODE fix must
# unblock torch.compile on its own. Full tracing exports are kept so a
# residual failure would still yield a traceback.
name: jz-a100-upeditc32
gpu_type: A100
remote_host: JZ
default: false
slurm:
    account: msf@a100
    job_name_prefix: UPEDITC32
    gres: gpu
    partition: null
    constraint: a100
    qos: qos_gpu_a100-t3
    dev_qos: qos_gpu_a100-dev
    max_time_hours: 20
    default_time: "19:59:59"
    dev_time: 01:59:59
    min_time: "19:00:00"
    use_min_time_default: true
    hint: nomultithread
    signal: SIGUSR1@600
    output: /lustre/fsn1/projects/rech/msf/uih12tb/upe_orch/logs/outputs/run%j.txt
    error: /lustre/fsn1/projects/rech/msf/uih12tb/upe_orch/logs/outputs/run%j.txt
    require_tag: false
resources:
    gpu_per_node: 8
    cpu_per_gpu: 8
    task_mode: per_gpu
    exclusive: false
    multi_gpu_overrides:
        trainer: ddp
modules:
    purge: true
    load:
        - arch/a100
        - git
environment:
    shell_init: /linkhome/rech/genuvt01/uih12tb/.bashrc
    activate_command: micromamba activate SatNew
    exports:
        SRUN_CPUS_PER_TASK: $SLURM_CPUS_PER_TASK
        PYTHONPATH: ./src
        TORCHDYNAMO_DISABLE: "0"
        # full diagnostic tracing so a residual compile failure yields a traceback
        TORCHDYNAMO_VERBOSE: "1"
        TORCH_LOGS: graph_breaks,recompiles
        # fresh, task-unique compiler cache for this composed snapshot
        TORCHINDUCTOR_CACHE_DIR: /lustre/fsn1/projects/rech/msf/uih12tb/upe_orch/inductor-c32c46f-temporal
        TMPDIR: /lustre/fsn1/projects/rech/msf/uih12tb/upe_orch/tmp
        PYTHONDONTWRITEBYTECODE: "1"
        WANDB__SERVICE_WAIT: "300"
        WANDB_MODE: offline
    wandb:
        mode: offline
        set_name: false
        set_group: false
paths:
    remote_launcher_dir: upe_orch/launcher/jz-a100-upeditc32
    default_project_dir: /lustre/fsn1/projects/rech/msf/uih12tb/upe_orch/code/5e80c9f-c32c46f-temporal
    data_dir: /lustre/fsn1/projects/rech/ufh/ult23zz/datasets/
    log_dir: /lustre/fsn1/projects/rech/msf/uih12tb/upe_orch/logs
default_overrides: {}
features:
    job_chaining: false
launcher:
    command_prefix: srun
project: AnySat
