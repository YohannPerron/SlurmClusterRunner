name: terra_gpu_context_share
gpu_type: GPU
remote_host: Terra
default: false
slurm:
  account: pn52pi-c
  job_name_prefix: TERRA-GPU
  gres: gpu
  partition: hpda2_compute_gpu
  constraint: null
  qos: null
  dev_qos: null
  max_time_hours: 240
  default_time: '48:00:00'
  dev_time: '2:00:00'
  min_time: null
  use_min_time_default: false
  hint: null
  signal: null
  output: /dss/dsstbyfs02/pn49cu/pn49cu-dss-0010/forest/generated/baseline_context_reruns/logs/%j.log
  error: /dss/dsstbyfs02/pn49cu/pn49cu-dss-0010/forest/generated/baseline_context_reruns/logs/%j.log
  require_tag: false
  exclude: hpdar01c03s02
  mem: 256G
  mail-user: yohann.perron@dm3l.uzh.ch
resources:
  gpu_per_node: 1
  cpu_per_gpu: 24
  task_mode: per_gpu
  exclusive: false
  multi_gpu_overrides:
    trainer: ddp
modules:
  purge: false
  load:
  - uv
  - gcc
  - git/2.49.0
environment:
  shell_init: null
  activate_command: ':'
  pre_run:
  - 'echo "Running on host: $(hostname)"'
  - export XDG_CACHE_HOME="${TMPDIR:-/tmp}/disfor-cache-${SLURM_JOB_ID}"
  - export NUMBA_CACHE_DIR="${TMPDIR:-/tmp}/disfor-numba-${SLURM_JOB_ID}"
  - export MPLCONFIGDIR="${TMPDIR:-/tmp}/disfor-mpl-${SLURM_JOB_ID}"
  exports:
    PYTHONDONTWRITEBYTECODE: '1'
    OMP_NUM_THREADS: '1'
    OPENBLAS_NUM_THREADS: '1'
    MKL_NUM_THREADS: '1'
    NUMBA_NUM_THREADS: '1'
  wandb:
    set_name: true
    set_group: true
    name_key: logger.wandb.name
    group_key: logger.wandb.group
paths:
  remote_launcher_dir: /dss/dsstbyfs02/pn49cu/pn49cu-dss-0010/forest/generated/baseline_context_reruns/launcher
  default_project_dir: /dss/dsshome1/0B/di54kay/code/disfor-code
  data_dir: /dss/dsshome1/0B/di54kay/data/disfor
  log_dir: /dss/dsstbyfs02/pn49cu/pn49cu-dss-0010/forest/generated/baseline_context_reruns/logs
default_overrides:
  test: 'false'
  trainer: gpu
  data.num_workers: '22'
  model.compile: 'false'
features:
  job_chaining: false
launcher:
  command_prefix: uv run --no-sync
project: disfor
