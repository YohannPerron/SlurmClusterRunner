# JZ H100 partition for the UPE distillation harness (owned by the
# simplify-upe-distillation task). Unique name + `default: false`: no shared
# cluster default is changed. `e1d8395` is substituted at install time with
# a per-run immutable code snapshot directory.
name: jz-h100-upe-distill
gpu_type: H100
remote_host: JZ
default: false
slurm:
    account: msf@h100
    job_name_prefix: UPEDIST
    gres: gpu
    partition: null
    constraint: h100
    qos: qos_gpu_h100-t3
    dev_qos: qos_gpu_h100-dev
    max_time_hours: 20
    default_time: "19:59:59"
    dev_time: 01:59:59
    min_time: "19:00:00"
    use_min_time_default: false
    hint: nomultithread
    signal: SIGUSR1@600
    output: /lustre/fsn1/projects/rech/msf/uih12tb/upe_distill_bench/logs/outputs/run%j.txt
    error: /lustre/fsn1/projects/rech/msf/uih12tb/upe_distill_bench/logs/outputs/run%j.txt
    require_tag: false
resources:
    gpu_per_node: 4
    cpu_per_gpu: 24
    task_mode: per_gpu
    exclusive: false
    multi_gpu_overrides: {}
modules:
    purge: true
    load:
        - arch/h100
        - git
environment:
    shell_init: /linkhome/rech/genuvt01/uih12tb/.bashrc
    activate_command: micromamba activate SatNew
    exports:
        SRUN_CPUS_PER_TASK: $SLURM_CPUS_PER_TASK
        PYTHONPATH: .:./src
        OMP_NUM_THREADS: "1"
        MKL_NUM_THREADS: "1"
        OPENBLAS_NUM_THREADS: "1"
        PYTHONDONTWRITEBYTECODE: "1"
        HF_HUB_OFFLINE: "1"
        UNIVERSAT_CKPT: /lustre/fsn1/projects/rech/msf/uih12tb/upe_distill/hf/models--g-astruc--UniverSat/model.safetensors
    # TMPDIR is node-local ($JOBSCRATCH) to keep the shared lustre project dir
    # free of scratch writes (EDQUOT).
    pre_run:
        - 'export TMPDIR="${JOBSCRATCH:-${SLURM_TMPDIR:-/tmp}}/tmp_${SLURM_JOB_ID:-0}"'
        - 'mkdir -p "$TMPDIR"'
    wandb:
        mode: offline
        set_name: false
        set_group: false
paths:
    remote_launcher_dir: upe_distill_bench/launcher/jz-h100-upe-distill
    default_project_dir: /lustre/fsn1/projects/rech/msf/uih12tb/upe_distill_bench/code/e1d8395
    data_dir: /lustre/fsn1/projects/rech/msf/uih12tb/upe_distill/pastis/PASTIS-R
    log_dir: /lustre/fsn1/projects/rech/msf/uih12tb/upe_distill_bench/logs
# The harness is plain argparse (parse_known_args); the runner's trailing Hydra
# overrides are ignored.
default_overrides: {}
features:
    job_chaining: false
launcher:
    command_prefix: srun
project: UniverSat
